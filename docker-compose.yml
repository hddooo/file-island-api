# Optional, isolated PostgreSQL for local HanQ tests only. Bound to loopback, non-default port, own volume/name.
#   HANQ_TEST_DB_PASSWORD=<local test-only password> docker compose up -d
#   HANQ_TEST_DATABASE_URL=postgresql://hanq_test:<same password>@127.0.0.1:55439/hanq_test
# Not for production. Uses no secrets from this repository.
name: hanq-back-test
services:
  hanq-test-db:
    image: postgres:17-alpine
    container_name: hanq-back-test-postgres
    environment:
      POSTGRES_DB: hanq_test
      POSTGRES_USER: hanq_test
      POSTGRES_PASSWORD: ${HANQ_TEST_DB_PASSWORD:?set HANQ_TEST_DB_PASSWORD in your shell}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - hanq_back_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanq_test -d hanq_test"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  hanq_back_test_pgdata:
