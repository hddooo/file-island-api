# LOCAL REVIEW PATCH ONLY. No runner registration or permission change is performed.
# Merge/activation requires approved API runner scope, exact inputs and controller review.
name: Functional six-suite qualification (execution receipts, no deployment)
on:
  workflow_dispatch:
    inputs:
      qualification_profile:
        type: choice
        required: true
        default: schema54
        options: [schema54, schema55-qualification, schema61-local-private-retained-base]
        description: Explicit reviewed schema contract; image-only55 is never qualification
permissions:
  contents: read
concurrency:
  group: api-functional-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    env:
      HANQ_FUNCTIONAL_QUALIFICATION_PROFILE: ${{ inputs.qualification_profile }}
      SOURCE_CONTRACT_MIGRATION_PROFILE: ${{ inputs.qualification_profile == 'schema55-qualification' && 'schema55-image-only' || 'schema54' }}
    if: github.repository == 'hddooo/file-island-api' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.qualification_profile != 'schema61-local-private-retained-base'
    runs-on: [self-hosted, Windows, X64, hanq-api-qualification]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate producer, inventory and harness contracts
        run: node --test scripts/api-test-inventory.test.cjs scripts/functional-evidence.test.cjs scripts/functional-api-tests.test.cjs scripts/functional-api-fixture.test.cjs scripts/functional-core-ui.test.cjs scripts/prepare-functional-plan.test.cjs scripts/functional-bootstrap55.test.cjs scripts/functional-schema-profile.test.cjs
      - name: Verify exact committed test inventory for the explicit qualification profile
        run: node scripts/api-test-inventory.cjs --qualification-profile ${{ inputs.qualification_profile }}
      - name: Execute reviewed six-suite recipe
        shell: pwsh
        # Non-secret, pre-reviewed local FILE PATHS. Keep input roots outside the
        # Actions checkout so checkout cleanup cannot erase prepared local inputs.
        env:
          HANQ_FUNCTIONAL_PLAN_FILE: ${{ vars.HANQ_FUNCTIONAL_PLAN_FILE }}
          HANQ_FUNCTIONAL_ROOTS_FILE: ${{ vars.HANQ_FUNCTIONAL_ROOTS_FILE }}
        run: |
          $ErrorActionPreference='Stop'
          if (!$env:HANQ_FUNCTIONAL_PLAN_FILE -or !$env:HANQ_FUNCTIONAL_ROOTS_FILE) { throw 'Reviewed execution inputs required' }
          node scripts/run-functional-evidence.cjs $env:HANQ_FUNCTIONAL_PLAN_FILE $env:HANQ_FUNCTIONAL_ROOTS_FILE release-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact execution evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hanq-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 14
  qualify-current61:
    env:
      HANQ_FUNCTIONAL_QUALIFICATION_PROFILE: ${{ inputs.qualification_profile }}
    if: github.repository == 'hddooo/file-island-api' && github.ref == 'refs/heads/release/source-grading-current-runtime' && github.event_name == 'workflow_dispatch' && inputs.qualification_profile == 'schema61-local-private-retained-base'
    runs-on: [self-hosted, Windows, X64, hanq-api-qualification]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate producer, inventory and harness contracts
        run: node --max-old-space-size=256 --test --test-concurrency=1 scripts/api-test-inventory.test.cjs scripts/functional-evidence.test.cjs scripts/functional-api-tests.test.cjs scripts/functional-api-fixture.test.cjs scripts/functional-core-ui.test.cjs scripts/prepare-functional-plan.test.cjs scripts/functional-bootstrap55.test.cjs scripts/functional-schema-profile.test.cjs
      - name: Validate exact fixed current-runtime pure tests
        run: node scripts/run-current-runtime-pure-tests.cjs
      - name: Validate fixed current61 storage, phase and FE host regressions
        run: node --max-old-space-size=256 --test --test-concurrency=1 scripts/current61-contract-host.test.cjs scripts/current61-contract-proof.test.cjs scripts/current61-case-wiring.test.cjs scripts/current61-phase-memory-gate.test.cjs scripts/fe-unit-host.test.cjs scripts/fe-unit-scopes-browser-preload.test.cjs scripts/workflow-cli.test.cjs scripts/current61-release-build-host.test.cjs scripts/current-runtime-core-ui-membership-guard.test.cjs scripts/current-runtime-five-file.test.cjs
      - name: Verify current61 inventory against reviewed plan bindings
        shell: pwsh
        env:
          HANQ_FUNCTIONAL_PLAN_FILE: ${{ vars.HANQ_FUNCTIONAL_PLAN_FILE }}
        run: |
          $ErrorActionPreference='Stop'
          if (!$env:HANQ_FUNCTIONAL_PLAN_FILE) { throw 'Reviewed plan required' }
          $pin = node -e "const fs=require('node:fs'),C=require('./scripts/functional-evidence.cjs'),R=require('./scripts/current-runtime-contract.cjs');const p=JSON.parse(fs.readFileSync(process.env.HANQ_FUNCTIONAL_PLAN_FILE,'utf8')),b=C.validateBindings(p.bindings);R.producer(process.env,b.apiCommit);console.log(b.testInventorySha256);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($pin -cnotmatch '^[a-f0-9]{64}$') { throw 'Exact inventory pin required' }
          node scripts/api-test-inventory.cjs --qualification-profile schema61-local-private-retained-base --inventory-sha256 $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute reviewed six-suite recipe
        shell: pwsh
        # Non-secret, pre-reviewed local FILE PATHS. Keep input roots outside the
        # Actions checkout so checkout cleanup cannot erase prepared local inputs.
        env:
          HANQ_FUNCTIONAL_PLAN_FILE: ${{ vars.HANQ_FUNCTIONAL_PLAN_FILE }}
          HANQ_FUNCTIONAL_ROOTS_FILE: ${{ vars.HANQ_FUNCTIONAL_ROOTS_FILE }}
        run: |
          $ErrorActionPreference='Stop'
          if (!$env:HANQ_FUNCTIONAL_PLAN_FILE -or !$env:HANQ_FUNCTIONAL_ROOTS_FILE) { throw 'Reviewed execution inputs required' }
          node scripts/run-functional-evidence.cjs $env:HANQ_FUNCTIONAL_PLAN_FILE $env:HANQ_FUNCTIONAL_ROOTS_FILE release-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact execution evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hanq-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 14
