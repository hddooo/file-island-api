# LOCAL REVIEW PATCH ONLY. No runner registration or permission change is performed.
# Merge/activation requires approved API runner scope, exact inputs and controller review.
name: Functional six-suite qualification (execution receipts, no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-functional-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'hddooo/file-island-api' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, hanq-api-qualification]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate producer, inventory and harness contracts
        run: node --test scripts/api-test-inventory.test.cjs scripts/functional-evidence.test.cjs scripts/functional-api-tests.test.cjs scripts/functional-api-fixture.test.cjs scripts/functional-core-ui.test.cjs scripts/prepare-functional-plan.test.cjs
      - name: Verify exact committed API66/40 test inventory
        run: node scripts/api-test-inventory.cjs
      - name: Execute reviewed six-suite recipe
        shell: pwsh
        # Non-secret, pre-reviewed local FILE PATHS. Keep input roots outside the
        # Actions checkout so checkout cleanup cannot erase prepared local inputs.
        env:
          HANQ_FUNCTIONAL_PLAN_FILE: ${{ vars.HANQ_FUNCTIONAL_PLAN_FILE }}
          HANQ_FUNCTIONAL_ROOTS_FILE: ${{ vars.HANQ_FUNCTIONAL_ROOTS_FILE }}
          HANQ_TOEIC_FIXTURE_DIR: ${{ vars.HANQ_TOEIC_FIXTURE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          if (!$env:HANQ_FUNCTIONAL_PLAN_FILE -or !$env:HANQ_FUNCTIONAL_ROOTS_FILE -or !$env:HANQ_TOEIC_FIXTURE_DIR) { throw 'Reviewed execution inputs and original local fixture required' }
          node scripts/run-functional-evidence.cjs $env:HANQ_FUNCTIONAL_PLAN_FILE $env:HANQ_FUNCTIONAL_ROOTS_FILE release-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact execution evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hanq-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 14
