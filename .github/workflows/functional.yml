name: Publish verified local release results (no CI test execution)
on:
  workflow_dispatch:
    inputs:
      qualification_profile:
        type: choice
        required: true
        default: schema61-local-private-retained-base
        options: [schema54, schema55-qualification, schema61-local-private-retained-base]
        description: Current61 publishes local evidence; legacy publication is unsupported
permissions:
  contents: read
concurrency:
  group: api-functional-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reject-unsupported:
    if: github.repository != 'hddooo/file-island-api' || github.ref != 'refs/heads/release/source-grading-current-runtime' || inputs.qualification_profile != 'schema61-local-private-retained-base'
    runs-on: [self-hosted, Windows, X64, hanq-api-qualification]
    steps:
      - name: Reject unsupported publication scope without running tests
        run: node -e "throw new Error('Unsupported local publication scope')"
  qualify-current61:
    env:
      HANQ_FUNCTIONAL_QUALIFICATION_PROFILE: ${{ inputs.qualification_profile }}
    if: github.repository == 'hddooo/file-island-api' && github.ref == 'refs/heads/release/source-grading-current-runtime' && github.event_name == 'workflow_dispatch' && inputs.qualification_profile == 'schema61-local-private-retained-base'
    runs-on: [self-hosted, Windows, X64, hanq-api-qualification]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact inventory against reviewed publication bindings
        shell: pwsh
        env:
          HANQ_FUNCTIONAL_PLAN_FILE: ${{ vars.HANQ_FUNCTIONAL_PLAN_FILE }}
        run: |
          $ErrorActionPreference='Stop'
          if (!$env:HANQ_FUNCTIONAL_PLAN_FILE) { throw 'Reviewed plan required' }
          $pin = node -e "const fs=require('node:fs'),C=require('./scripts/functional-evidence.cjs'),R=require('./scripts/current-runtime-contract.cjs');const p=JSON.parse(fs.readFileSync(process.env.HANQ_FUNCTIONAL_PLAN_FILE,'utf8')),b=C.validateBindings(p.bindings);R.producer(process.env,b.apiCommit);console.log(b.testInventorySha256);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($pin -cnotmatch '^[a-f0-9]{64}$') { throw 'Exact inventory pin required' }
          node scripts/api-test-inventory.cjs --qualification-profile schema61-local-private-retained-base --inventory-sha256 $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and publish completed local results without executing tests
        shell: pwsh
        env:
          HANQ_FUNCTIONAL_PLAN_FILE: ${{ vars.HANQ_FUNCTIONAL_PLAN_FILE }}
          HANQ_FUNCTIONAL_ROOTS_FILE: ${{ vars.HANQ_FUNCTIONAL_ROOTS_FILE }}
          HANQ_LOCAL_EXECUTION_FILE: ${{ vars.HANQ_LOCAL_EXECUTION_FILE }}
        run: |
          $ErrorActionPreference='Stop'
          if (!$env:HANQ_FUNCTIONAL_PLAN_FILE -or !$env:HANQ_FUNCTIONAL_ROOTS_FILE -or !$env:HANQ_LOCAL_EXECUTION_FILE) { throw 'Exact completed local result and reviewed inputs required' }
          node scripts/publish-local-functional-evidence.cjs $env:HANQ_LOCAL_EXECUTION_FILE $env:HANQ_FUNCTIONAL_PLAN_FILE $env:HANQ_FUNCTIONAL_ROOTS_FILE release-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact local-execution publication only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hanq-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 14
