name: API baseline tests only (no image or deployment)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-independent-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund
      - name: Verify image and functional qualification contracts
        run: node --test scripts/image-build-contract.test.cjs scripts/functional-evidence.test.cjs scripts/functional-api-tests.test.cjs scripts/functional-core-ui.test.cjs
      - run: npm run typecheck
      - name: Unit tests independent of private frontend fixtures
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsc -p tsconfig.json
          mapfile -t tests < <(find dist/test/unit -name '*.test.js' ! -name 'catalog.test.js' ! -name 'quality-revision.test.js' | sort)
          test "${#tests[@]}" -gt 0
          node --test --test-concurrency=1 "${tests[@]}"
      - run: npm run build
      - name: Report coverage boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'This CI uses no application secrets or production database.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'catalog.test.js and quality-revision.test.js require private FE fixtures and are not run. PostgreSQL integration and optional local-original fixtures are not covered.' >> "$GITHUB_STEP_SUMMARY"
      - name: Existing lint gate (runs after tests to preserve test evidence)
        if: always()
        run: npm run lint
