name: API baseline tests only (no image or deployment)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-independent-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund
      - name: Verify image and functional qualification contracts
        run: node --test scripts/api-test-inventory.test.cjs scripts/image-build-contract.test.cjs scripts/functional-evidence.test.cjs scripts/functional-api-tests.test.cjs scripts/functional-api-fixture.test.cjs scripts/functional-core-ui.test.cjs scripts/prepare-functional-plan.test.cjs
      - run: npm run typecheck
      - name: Unit tests independent of private frontend and textbook fixtures
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsc -p tsconfig.json
          node scripts/run-ci-unit.cjs
      - run: npm run build
      - name: Report coverage boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'This CI uses no application secrets or production database.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Hosted CI excludes catalog.test.js, quality-revision.test.js, source-answer-normalization.test.js, source-blank-progress.test.js and source-blank-workspace.test.js because their private FE/textbook fixtures are unavailable. Test sources remain unchanged. Both CI producers run exactly62 of67 source unit files and reject skipped/incomplete results. Three optional original-only TOEIC cases are outside CI in test/local-original. PostgreSQL integration is covered by the separate functional producer.' >> "$GITHUB_STEP_SUMMARY"
      - name: Existing lint gate (runs after tests to preserve test evidence)
        if: always()
        run: npm run lint
