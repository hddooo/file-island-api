name: API image build only (not deployment qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-image-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main' && github.repository == 'hddooo/file-island-api'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate image build contract
        run: node --test scripts/image-build-contract.test.cjs
      - name: Build LF image and run isolated native-module smoke
        run: node scripts/build-file-island-image.cjs --build
      - name: Retain image build evidence (not a functional qualification receipt)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: file-island-api-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            release-artifact/hanq-api.tar.gz
            release-artifact/release.json
            release-artifact/context-manifest.json
            release-artifact/SHA256SUMS
